services:
  asset-checkout:
    container_name: AssetCheckout
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    volumes:
      - /assetc/data:/data
    env_file:
      - backend/.env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/data/database.db
      # Quote documents, on the same persistent volume as the database — they
      # evidence what each department committed to spend.
      - QUOTES_DIR=/data/quotes
      # Troubleshooting screenshots uploaded by admins. On the volume, because
      # the container filesystem is replaced on every deploy.
      - TROUBLESHOOTING_IMAGES_DIR=/data/troubleshooting
      - PORT=3000
    restart: unless-stopped
