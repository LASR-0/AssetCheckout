<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Applies the theme preset BEFORE the first paint.

      next-themes does exactly this for the light/dark class; presets need
      their own because they are a different attribute and the palette lives
      in CSS keyed on it. Without this the page renders in the built-in palette
      and repaints once React mounts — a visible flash on every single load,
      not just the first.

      Kept deliberately tiny and dependency-free: it runs before the bundle
      exists. The keys match lib/presets.ts, and the try/catch is because
      localStorage throws outright in some privacy modes rather than returning
      null.
    -->
    <script>
      (function () {
        try {
          var chosen = localStorage.getItem("ui-preset");
          var preset = chosen || localStorage.getItem("ui-preset-default");
          // "default" is the absence of an attribute — the base palette in
          // index.css — so there is nothing to set for it.
          if (preset && preset !== "default") {
            document.documentElement.setAttribute("data-preset", preset);
          }
        } catch (e) {
          /* No storage: the built-in palette is a correct answer. */
        }
      })();
    </script>
    <title>KSB Checkout Central</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
