<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      NO WEBFONT LINKS HERE. There were four, and all of them were costing
      more than they returned:

        * Manrope and Inter were never used by anything. The body face is
          Figtree, self-hosted through @fontsource in index.css. Two render-
          blocking round trips to a third party for nothing.
        * Material Symbols was requested TWICE, and the fuller of the two
          resolves to a 3.98 MB woff2 — every one of the 4,284 glyphs in the
          library, to draw the ~140 this app uses. Worse than the size: these
          icons are addressed by ligature, so until the font arrived each one
          rendered as its own name, and the page showed the words "error",
          "close" and "content_copy" where the icons belonged.

      The icon font is now a 146 KB subset built by scripts/build-icon-font.mjs
      and imported from main.tsx, so Vite fingerprints it and it is served from
      our own origin under an immutable cache header. Fonts loaded through the
      bundle also need no preconnect — there is no third-party origin left to
      warm up, which is just as well, since the preconnects that were here sat
      BELOW the stylesheets they were meant to accelerate and so did nothing.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Applies the theme preset BEFORE the first paint.

      next-themes does exactly this for the light/dark class; presets need
      their own because they are a different attribute and the palette lives
      in CSS keyed on it. Without this the page renders in the built-in palette
      and repaints once React mounts — a visible flash on every single load,
      not just the first.

      Kept deliberately tiny and dependency-free: it runs before the bundle
      exists. The keys match lib/presets.ts, and the try/catch is because
      localStorage throws outright in some privacy modes rather than returning
      null.
    -->
    <script>
      (function () {
        try {
          var chosen = localStorage.getItem("ui-preset");
          var preset = chosen || localStorage.getItem("ui-preset-default");
          // "default" is the absence of an attribute — the base palette in
          // index.css — so there is nothing to set for it.
          if (preset && preset !== "default") {
            document.documentElement.setAttribute("data-preset", preset);
          }
        } catch (e) {
          /* No storage: the built-in palette is a correct answer. */
        }
      })();
    </script>
    <title>KSB Checkout Central</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
